<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Build your fort by day. Defend it from zombies by night." />
    <title>Build or Bite</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 22px;
        color: #f4efe6;
        background: radial-gradient(ellipse at 50% 0%, #263c36 0%, #101820 58%, #0b1016 100%);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 720px);
        padding: clamp(22px, 5vw, 44px);
        border: 1px solid rgba(201, 173, 112, .45);
        border-radius: 22px;
        background: rgba(10, 16, 21, .92);
        box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
        text-align: center;
      }
      .eyebrow { margin: 0 0 10px; color: #d7b979; font-size: 12px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .logo { display: block; width: min(100%, 440px); max-height: 170px; margin: 0 auto; object-fit: contain; filter: drop-shadow(0 12px 28px rgba(0, 0, 0, .72)); }
      .tagline { margin: 13px 0 0; color: #f4c66d; font-size: clamp(17px, 3vw, 22px); font-weight: 750; }
      .description { max-width: 540px; margin: 14px auto 0; color: #d6ded9; font-size: 15px; line-height: 1.6; }
      .steps { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 22px 0; }
      .step { padding: 9px 13px; border: 1px solid #354840; border-radius: 999px; background: #16231f; color: #e2e8df; font-size: 13px; font-weight: 650; }
      button {
        min-height: 50px; padding: 0 26px; border: 0; border-radius: 12px;
        color: #18201b; background: #e2b957; font: inherit; font-size: 16px;
        font-weight: 850; cursor: pointer; box-shadow: 0 5px 0 #9a7130;
      }
      button:hover { background: #f1ca6a; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
      .hint { min-height: 20px; margin: 15px 0 0; color: #b7c3bc; font-size: 12px; }
      @media (max-width: 420px) { body { padding: 12px; } main { border-radius: 16px; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="game-title">
      <p class="eyebrow">A forest-fort survival game</p>
      <h1 id="game-title" class="sr-only">Build or Bite</h1>
      <img class="logo" src="/assets/aistudio/build-or-bite-title-removebg-preview_49acf47a.png" alt="Build or Bite" />
      <p class="tagline">Build by day. Bite back at night.</p>
      <p class="description">Gather supplies, build and upgrade your fort, then survive waves of spooky, silly zombies.</p>
      <div class="steps" aria-label="Game loop">
        <span class="step">DAY · Gather &amp; build</span>
        <span class="step">NIGHT · Defend the fort</span>
      </div>
      <button id="play-button" type="button">Start Run · 1 Ticket</button>
      <button id="demo-button" type="button" hidden>Open Demo Menu · No Ticket</button>
      <p class="hint" id="play-hint" aria-live="polite">Starts a run in the game view and uses one daily ticket.</p>
    </main>
    <script type="module" src="./splash.ts"></script>
  </body>
</html>
