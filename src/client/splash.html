<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Build your fort by day. Defend it from zombies by night." />
    <title>Build or Bite</title>
    <style>
      @font-face { font-family: Creepster; src: url('/assets/fonts/Creepster-Regular.ttf') format('truetype'); font-display: swap; }
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        min-height: 100vh; display: grid; place-items: center; padding: 22px;
        color: #fff1dc; font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(90deg, rgba(9, 8, 18, .94), rgba(11, 9, 20, .48) 56%, rgba(10, 8, 18, .22)),
          url('/assets/aistudio/hero-ranger-rue_33302ab4.png') center center / cover no-repeat, #11101d;
      }
      main {
        width: min(100%, 720px); padding: clamp(20px, 4vw, 38px);
        border: 1px solid rgba(255, 96, 87, .38); border-radius: 22px;
        background: rgba(13, 10, 19, .68); box-shadow: 0 20px 70px rgba(0, 0, 0, .45);
        text-align: center; text-shadow: 0 2px 4px #180308;
      }
      .eyebrow { margin: 0 0 10px; color: #ff525c; font-size: 15px; letter-spacing: .14em; text-transform: uppercase; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .logo { display: block; width: min(100%, 440px); max-height: 170px; margin: 0 auto; object-fit: contain; filter: drop-shadow(0 12px 28px rgba(0, 0, 0, .72)); }
      .tagline { margin: 13px 0 0; color: #fff1dc; font-size: clamp(22px, 4vw, 32px); font-weight: 800; letter-spacing: .01em; }
      .description { max-width: 540px; margin: 12px auto 0; color: #f8e7da; font-size: 19px; line-height: 1.45; }
      .steps { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin: 18px 0; }
      .step { padding: 8px 12px; border: 1px solid #ad424a; border-radius: 999px; background: rgba(27, 13, 22, .9); color: #ffe6dc; font-size: 16px; font-weight: 600; letter-spacing: .01em; }
      button {
        min-height: 50px; padding: 0 24px; margin: 3px; border: 1px solid #e35558; border-radius: 12px;
        color: #fff2e8; background: #54212a; font: inherit; font-size: 19px; font-weight: 700; letter-spacing: .01em;
        cursor: pointer; box-shadow: 0 4px 0 #681d26;
      }
      button:hover { background: #4b1924; color: #ff9c9f; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }
      .hint { min-height: 20px; margin: 13px 0 0; color: #ff8c8c; font-size: 16px; }
      @media (max-width: 420px) { body { padding: 12px; background-position: 58% center; } main { border-radius: 16px; padding: 18px 14px; } .description { font-size: 17px; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="game-title">
      <p class="eyebrow">A forest-fort survival game</p>
      <h1 id="game-title" class="sr-only">Build or Bite</h1>
      <img class="logo" src="/assets/aistudio/build-or-bite-title-removebg-preview_49acf47a.png" alt="Build or Bite" />
      <p class="tagline">Build by day. Bite back at night.</p>
      <p class="description">Gather supplies, build and upgrade your fort, then survive waves of spooky, silly zombies.</p>
      <div class="steps" aria-label="Game loop">
        <span class="step">DAY · Gather &amp; build</span>
        <span class="step">NIGHT · Defend the fort</span>
      </div>
      <button id="play-button" type="button">Start Run · 1 Ticket</button>
      <button id="demo-button" type="button" hidden>Open Demo Menu · No Ticket</button>
      <p class="hint" id="play-hint" aria-live="polite">Starts a run in the game view and uses one daily ticket.</p>
    </main>
    <script type="module" src="./splash.ts"></script>
  </body>
</html>
