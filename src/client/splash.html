<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101820" />
    <meta name="description" content="Build your fort by day. Defend it from zombies by night." />
    <title>Build or Bite</title>
    <style>
      @font-face { font-family: Creepster; src: url('/assets/fonts/Creepster-Regular.ttf') format('truetype'); font-display: swap; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        display: grid; place-items: center; padding: 8px;
        color: #fff1dc; font-family: system-ui, -apple-system, sans-serif;
        background: linear-gradient(90deg, rgba(9, 8, 18, .94), rgba(11, 9, 20, .48) 56%, rgba(10, 8, 18, .22)),
          url('/assets/aistudio/hero-ranger-rue_33302ab4.png') center / cover no-repeat, #11101d;
      }
      main {
        width: min(100%, 720px); max-height: 100%; padding: clamp(8px, 2vh, 18px);
        border: 1px solid rgba(255, 96, 87, .38); border-radius: 16px;
        background: rgba(13, 10, 19, .78); text-align: center; text-shadow: 0 2px 4px #180308;
      }
      .eyebrow { margin: 0 0 3px; color: #ff9299; font-size: 12px; letter-spacing: .1em; text-transform: uppercase; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      .logo { display: block; width: min(100%, 310px); height: clamp(40px, 16vh, 90px); margin: 0 auto; object-fit: contain; }
      .tagline { margin: 4px 0 0; color: #fff1dc; font-size: clamp(16px, 3vh, 22px); font-weight: 800; }
      .description { max-width: 540px; margin: 5px auto 0; font-size: 14px; line-height: 1.3; }
      .steps { display: flex; justify-content: center; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
      .step { padding: 4px 8px; border: 1px solid #ad424a; border-radius: 999px; background: rgba(27, 13, 22, .9); font-size: 12px; font-weight: 600; }
      button {
        min-height: 44px; padding: 0 15px; margin: 2px; border: 1px solid #e35558; border-radius: 10px;
        color: #fff2e8; background: #54212a; font: inherit; font-size: 15px; font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: #4b1924; color: #ffb7ba; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
      .hint { margin: 4px 0 0; color: #ffb4b4; font-size: 12px; }
      @media (max-height: 360px) { .eyebrow, .description, .steps { display: none; } }
      @media (max-height: 250px) { .tagline, .hint { display: none; } .logo { height: 38px; } main { padding: 5px; } }
    </style>
  </head>
  <body>
    <main aria-labelledby="game-title">
      <p class="eyebrow">A forest-fort survival game</p>
      <h1 id="game-title" class="sr-only">Build or Bite</h1>
      <img class="logo" src="/assets/aistudio/build-or-bite-title-removebg-preview_49acf47a.png" alt="Build or Bite" />
      <p class="tagline">Build by day. Bite back at night.</p>
      <p class="description">Gather supplies, build and upgrade your fort, then survive waves of spooky, silly zombies.</p>
      <div class="steps" aria-label="Game loop">
        <span class="step">DAY · Gather &amp; build</span>
        <span class="step">NIGHT · Defend the fort</span>
      </div>
      <button id="play-button" type="button">Start Run · 1 Ticket</button>
      <button id="demo-button" type="button" hidden>Open Demo Menu · No Ticket</button>
      <p class="hint" id="play-hint" aria-live="polite">Starts a run in the game view and uses one daily ticket.</p>
    </main>
    <script type="module" src="./splash.ts"></script>
  </body>
</html>
